<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 가족여행 안내</title>
<style>
  :root {
    --main: #1f5fbf;
    --main-dark: #153f80;
    --main-light: #e8f0fc;
    --bg: #f6f8fb;
    --card: #ffffff;
    --text: #1d2430;
    --sub: #5a6577;
    --line: #d9e0ea;
    --warn-bg: #fff6e0;
    --warn-line: #e3b341;
    --warn-text: #7a5300;
    --ok: #1f7a4d;
  }
  * { box-sizing: border-box; }
  html { font-size: 18px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.65;
  }
  header.top {
    background: var(--main);
    color: #fff;
    padding: 20px 16px 16px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  header.top .wrap { padding: 0; }
  header.top h1 { margin: 0 0 4px; font-size: 1.7rem; }
  header.top p { margin: 0; opacity: 0.92; font-size: 0.95rem; }
  nav.menu {
    background: #fff;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav.menu .wrap { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 6px; padding-bottom: 6px; }
  nav.menu button {
    font: inherit;
    font-weight: 700;
    border: 0;
    background: transparent;
    color: var(--sub);
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    min-height: 44px;
  }
  nav.menu button:hover { background: var(--main-light); color: var(--main-dark); }
  nav.menu button.active { background: var(--main); color: #fff; }
  nav.menu button:focus-visible, .thumb:focus-visible, .close:focus-visible { outline: 3px solid #f0a500; outline-offset: 2px; }
  main { padding: 20px 0 40px; }
  section.tab { display: none; }
  section.tab.active { display: block; }
  h2 { font-size: 1.45rem; margin: 8px 0 12px; color: var(--main-dark); }
  h3 { font-size: 1.15rem; margin: 0 0 6px; }
  .banner {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 8px solid var(--main);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; }
  .stat { background: var(--main-light); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; color: var(--sub); font-size: 0.8rem; font-weight: 600; }
  .stat span { font-size: 1.05rem; font-weight: 700; color: var(--main-dark); }
  .notice {
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    color: var(--warn-text);
    border-radius: 10px;
    padding: 10px 14px;
    margin: 12px 0;
    font-size: 0.95rem;
  }
  .notice ul { margin: 4px 0 0; padding-left: 1.2em; }
  .daycards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 14px; }
  .daycard {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    text-align: left;
    font: inherit;
    cursor: pointer;
    color: inherit;
  }
  .daycard:hover { border-color: var(--main); box-shadow: 0 2px 10px rgba(31,95,191,0.15); }
  .daycard strong { display: block; color: var(--main-dark); font-size: 1.1rem; }
  .daycard small { color: var(--sub); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th { background: var(--main); color: #fff; text-align: left; padding: 10px 12px; font-size: 0.95rem; }
  td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; font-size: 0.97rem; }
  td.time { white-space: nowrap; font-weight: 700; color: var(--main-dark); width: 6.5em; }
  td.plan { font-weight: 700; width: 30%; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .tablewrap { overflow-x: auto; }
  .place {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin: 16px 0;
  }
  .place header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-bottom: 8px; }
  .place .when { background: var(--main); color: #fff; border-radius: 20px; padding: 2px 12px; font-size: 0.85rem; font-weight: 700; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
  .tag { background: var(--main-light); color: var(--main-dark); border-radius: 14px; padding: 1px 10px; font-size: 0.85rem; }
  .photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin: 10px 0; }
  .thumb {
    border: 0; padding: 0; background: #dfe6f0; border-radius: 10px; overflow: hidden; cursor: zoom-in;
    aspect-ratio: 4 / 3; display: block; width: 100%;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photonote { color: var(--sub); font-size: 0.82rem; margin: 0 0 8px; }
  dl.info { display: grid; grid-template-columns: 7.5em 1fr; gap: 4px 10px; margin: 8px 0; font-size: 0.95rem; }
  dl.info dt { color: var(--sub); font-weight: 700; }
  dl.info dd { margin: 0; }
  .check { color: var(--warn-text); }
  .src { font-size: 0.82rem; color: var(--sub); word-break: break-all; }
  .src a { color: var(--main); }
  .bars { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
  .barrow { display: grid; grid-template-columns: 9em 1fr 8.5em; gap: 10px; align-items: center; margin: 8px 0; font-size: 0.95rem; }
  .track { position: relative; height: 18px; background: #e6ebf3; border-radius: 9px; }
  .fill { position: absolute; top: 0; bottom: 0; background: var(--main); border-radius: 9px; opacity: 0.85; }
  .limit { position: absolute; top: -4px; bottom: -4px; width: 3px; background: #c0392b; }
  .totalrow td { font-weight: 800; background: var(--main-light); }
  .legend { font-size: 0.85rem; color: var(--sub); }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .box ul { margin: 6px 0 0; padding-left: 1.2em; }
  .box li { margin: 4px 0; }
  footer.bottom { background: #fff; border-top: 1px solid var(--line); padding: 18px 0 28px; color: var(--sub); font-size: 0.9rem; }
  footer.bottom ul { margin: 6px 0 0; padding-left: 1.2em; }
  .lightbox {
    position: fixed; inset: 0; background: rgba(10, 18, 30, 0.88); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 16px; flex-direction: column;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 82vh; border-radius: 8px; }
  .lightbox p { color: #fff; margin: 10px 0 0; text-align: center; font-size: 0.95rem; }
  .close { position: absolute; top: 12px; right: 12px; font: inherit; font-weight: 700; background: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; min-height: 44px; }
  @media (max-width: 640px) {
    html { font-size: 17px; }
    .barrow { grid-template-columns: 1fr; gap: 2px; }
    dl.info { grid-template-columns: 1fr; }
    dl.info dt { margin-top: 4px; }
    td.plan { width: auto; }
  }
  @media print {
    nav.menu, .lightbox { display: none !important; }
    section.tab { display: block !important; page-break-after: always; }
  }
</style>
</head>

  ["숙박 (3박)", 30, 55, "1박 10만~18만원으로 가정한 값. 실제 12월 가격은 확인 못 함"],
  ["렌터카 (4일) + 보험 + 기름값", 30, 45, "한 가이드의 중형 세단 예시 32만~46만원. 12월은 비싼 달이라는 집계도 있음"],
  ["식비 (3박 4일)", 40, 50, "갈치정식 2인 6만원, 흑돼지 kg당 7만5천원 후기 기준"],

/* ===== 화면 만들기 ===== */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function man(n) { return n + "만원"; }

var TABS = [
  { id: "all", label: "전체" },
  { id: "day1", label: "1일차" },
  { id: "day2", label: "2일차" },
  { id: "day3", label: "3일차" },
  { id: "day4", label: "4일차" },
  { id: "budget", label: "예산" },
  { id: "food", label: "숙소와 맛집" }
];

function renderOverview() {
  var h = '<section class="tab" id="tab-all" aria-label="전체">';
  h += '<div class="banner"><h2 style="margin-top:0">여행 요약</h2><div class="stats">';
  SUMMARY.forEach(function (s) {
    h += '<div class="stat"><b>' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span></div>';
  });
  h += '</div></div>';
  h += '<div class="notice"><b>먼저 알아 둘 것</b><ul>' +
    '<li>가는 비행기 시간이 정해지지 않아서 1일차는 "오전 10시 전후 제주 도착"으로 가정했습니다.</li>' +
    '<li>장소 영업시간, 입장료, 가격은 가기 전에 꼭 최신 정보를 확인해야 합니다.</li>' +
    '<li>한라산은 12월에 눈과 얼음 때문에 도로나 탐방로가 막힐 수 있습니다. 2일차에 막혔을 때 바꿀 계획이 있습니다.</li>' +
    '<li>걷기는 적게, 차로 이동해서 가까이 내려 구경하는 일정입니다. 한라산 정상 등반은 하지 않습니다.</li>' +
    '</ul></div>';
  h += '<h2>일차별 보기</h2><div class="daycards">';
  DAYS.forEach(function (d) {
    h += '<button class="daycard" data-go="' + d.id + '"><strong>' + esc(d.label) + ' (' + esc(d.date) + ')</strong>' +
      esc(d.title) + '<br><small>장소 ' + d.places.length + '곳</small></button>';
  });
  h += '</div>';
  h += '<h2>4일 일정 한눈에</h2>';
  DAYS.forEach(function (d) {
    h += '<h3>' + esc(d.label) + ' (' + esc(d.date) + ') ' + esc(d.title) + '</h3>' + scheduleTable(d);
  });
  h += '</section>';
  return h;
}

function scheduleTable(d) {
  var h = '<div class="tablewrap"><table><thead><tr><th>시간</th><th>일정</th><th>메모</th></tr></thead><tbody>';
  d.rows.forEach(function (r) {
    h += '<tr><td class="time">' + esc(r[0]) + '</td><td class="plan">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}

function photoPaths(d, p) {
  var list = [];
  for (var i = 1; i <= p.n; i++) {
    list.push("./Research/" + d.folder + "/사진/" + p.base + "_" + i + "." + p.ext);
  }
  return list;
}

function renderPlace(d, p) {
  var h = '<article class="place"><header><h3>' + esc(p.name) + '</h3><span class="when">' + esc(p.when) + '</span></header>';
  h += '<div class="tags">';
  p.tags.forEach(function (t) { h += '<span class="tag">#' + esc(t) + '</span>'; });
  h += '</div>';
  h += '<p>' + esc(p.desc) + '</p>';
  h += '<div class="photos">';
  photoPaths(d, p).forEach(function (src, i) {
    h += '<button class="thumb" data-src="' + esc(src) + '" data-cap="' + esc(p.name + " 사진 " + (i + 1)) + '" aria-label="' +
      esc(p.name) + ' 사진 ' + (i + 1) + ' 크게 보기"><img src="' + esc(src) + '" alt="' + esc(p.name) + ' 사진 ' + (i + 1) + '"></button>';
  });
  h += '</div><p class="photonote">' + esc(p.photonote) + '</p>';
  h += '<dl class="info">';
  p.info.forEach(function (r) { h += '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; });
  h += '</dl>';
  h += '<p class="check"><b>확인 필요:</b> ' + esc(p.check) + '</p>';
  h += '<p class="src">출처: ';
  h += p.src.map(function (s) { return '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a>'; }).join(", ");
  h += '</p></article>';
  return h;
}

function renderDay(d) {
  var h = '<section class="tab" id="tab-' + d.id + '" aria-label="' + esc(d.label) + '">';
  h += '<h2>' + esc(d.label) + ' (' + esc(d.date) + ') ' + esc(d.title) + '</h2>';
  h += scheduleTable(d);
  if (d.notes.length) {
    h += '<div class="notice"><ul>';
    d.notes.forEach(function (n) { h += '<li>' + esc(n) + '</li>'; });
    h += '</ul></div>';
  }
  h += '<h2>방문할 곳 (' + d.places.length + '곳)</h2>';
  d.places.forEach(function (p) { h += renderPlace(d, p); });
  h += '</section>';
  return h;
}

function renderBudget() {
  var minT = 0, maxT = 0;
  BUDGET.forEach(function (b) { minT += b[1]; maxT += b[2]; });
  var scale = 220;
  var h = '<section class="tab" id="tab-budget" aria-label="예산">';
  h += '<h2>예산 대략 계산 (추정치, 확인 필요)</h2>';
  h += '<div class="notice">아래 금액은 검색한 자료와 제가 가정한 값으로 계산한 추정치입니다. 실제 가격은 예약할 때 확인해야 합니다. 방 1개 기준입니다.</div>';
  h += '<div class="bars"><b>항목별 예상 범위</b>';
  BUDGET.forEach(function (b) {
    var left = (b[1] / 60) * 100, width = ((b[2] - b[1]) / 60) * 100;
    h += '<div class="barrow"><span>' + esc(b[0]) + '</span><div class="track"><div class="fill" style="left:' + left + '%;width:' + width + '%"></div></div><span>' + man(b[1]) + ' ~ ' + man(b[2]) + '</span></div>';
  });
  h += '<p class="legend">막대의 눈금은 0원부터 60만원까지입니다.</p></div>';
  h += '<div class="bars"><b>합계와 총 예산 비교</b>';
  var l = (minT / scale) * 100, w = ((maxT - minT) / scale) * 100, lim = (LIMIT / scale) * 100;
  h += '<div class="barrow"><span>합계 범위</span><div class="track"><div class="fill" style="left:' + l + '%;width:' + w + '%"></div><div class="limit" style="left:' + lim + '%" title="총 예산 ' + man(LIMIT) + '"></div></div><span>' + man(minT) + ' ~ ' + man(maxT) + '</span></div>';
  h += '<p class="legend">빨간 선은 총 예산 ' + man(LIMIT) + '입니다. 눈금은 0원부터 ' + man(scale) + '까지입니다. 합계의 위쪽 끝(' + man(maxT) + ')은 예산을 ' + man(maxT - LIMIT) + ' 넘습니다.</p></div>';
  h += '<div class="tablewrap"><table><thead><tr><th>항목</th><th class="num">최소</th><th class="num">최대</th><th>근거와 비고</th></tr></thead><tbody>';
  BUDGET.forEach(function (b) {
    h += '<tr><td class="plan">' + esc(b[0]) + '</td><td class="num">' + man(b[1]) + '</td><td class="num">' + man(b[2]) + '</td><td>' + esc(b[3]) + '</td></tr>';
  });
  h += '<tr class="totalrow"><td>합계</td><td class="num">' + man(minT) + '</td><td class="num">' + man(maxT) + '</td><td>방을 2개 잡으면 숙박비가 늘어 ' + man(LIMIT) + '을 넘기 쉽습니다</td></tr>';
  h += '</tbody></table></div>';
  h += '<div class="notice"><b>예산을 맞추는 기준</b><ul>' +
    '<li>숙박비 3박 합계가 약 45만원 이하(1박 15만원 이하)면 ' + man(LIMIT) + ' 안에 들어올 가능성이 큽니다.</li>' +
    '<li>4명이 한 방에 잘 수 있는지(최대 인원)를 꼭 확인해야 합니다.</li></ul></div>';
  h += '</section>';
  return h;
}

function renderFood() {
  var h = '<section class="tab" id="tab-food" aria-label="숙소와 맛집">';
  h += '<h2>맛집 후보</h2><div class="notice">가격은 후기, 블로그, 기사에서 가져온 값이고 연도가 섞여 있습니다. 가기 전에 확인하세요. 저녁 6~8시에는 인기 식당 대기가 길 수 있습니다.</div>';
  FOOD.forEach(function (g) {

    g[1].forEach(function (r) {
      h += '<tr><td class="plan">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>';
    });
    h += '</tbody></table></div>';
  });
  h += '<h2>숙소 (중문)</h2><div class="two"><div class="box"><b>이름이 확인된 곳</b><ul>';
  LODGE.forEach(function (r) { h += '<li><b>' + esc(r[0]) + '</b>: ' + esc(r[1]) + '</li>'; });
  h += '</ul></div><div class="box"><b>알아 둘 것</b><ul>' +
    '<li>두 곳의 12월 요금은 검색으로 확인하지 못했습니다. 12/1~12/4 날짜를 넣어 예약 앱에서 직접 조회해야 합니다.</li>' +
    '<li>주방이 있는 객실이면 아침이나 간식을 직접 해결해서 식비를 줄일 수 있습니다.</li>' +
    '<li>4명이 한 방에 잘 수 있는지(최대 인원)를 꼭 확인하세요.</li></ul></div></div>';
  h += '<h2>항공권과 렌터카</h2><div class="two"><div class="box"><b>항공권</b><ul>' +
    '<li>대구 출발 제주행 12월 최저가 44,452원 (왕복인지 편도인지 불명)</li>' +
    '<li>티웨이항공 왕복 49,272원부터 (기준 월 불명)</li>' +
    '<li>화요일이 가장 싼 요일 (12/1이 화요일)</li></ul></div>' +
    '<div class="box"><b>렌터카</b><ul>' +
    '<li>중형 세단 4일 예시: 대여료 20만~28만원, 완전자차 6만~12만원, 연료 약 6만원, 합계 32만~46만원</li>' +
    '<li>12월은 제주 렌터카 일 평균 요금이 가장 비싼 달이라는 집계가 있음</li>' +
    '<li>자차 면책금 조건을 함께 확인하세요</li></ul></div></div>';
  h += '</section>';
  return h;
}

document.getElementById("content").innerHTML =
  renderOverview() + DAYS.map(renderDay).join("") + renderBudget() + renderFood();

var menu = document.getElementById("menu");
TABS.forEach(function (t) {
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = t.label;
  b.setAttribute("data-tab", t.id);
  menu.appendChild(b);
});

function show(id) {
  var found = false;
  TABS.forEach(function (t) { if (t.id === id) found = true; });
  if (!found) id = "all";
  document.querySelectorAll("section.tab").forEach(function (s) {
    s.classList.toggle("active", s.id === "tab-" + id);
  });
  document.querySelectorAll("#menu button").forEach(function (b) {
    var on = b.getAttribute("data-tab") === id;
    b.classList.toggle("active", on);
    if (on) { b.setAttribute("aria-current", "page"); } else { b.removeAttribute("aria-current"); }
  });
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  window.scrollTo(0, 0);
}

document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-tab],[data-go]");
  if (t) { show(t.getAttribute("data-tab") || t.getAttribute("data-go")); return; }
  var th = e.target.closest(".thumb");
  if (th) { openBox(th.getAttribute("data-src"), th.getAttribute("data-cap")); }
});

var box = document.getElementById("lightbox");
function openBox(src, cap) {
  document.getElementById("lbimg").src = src;
  document.getElementById("lbimg").alt = cap;
  document.getElementById("lbcap").textContent = cap;
  box.classList.add("open");
  document.getElementById("lbclose").focus();
}
function closeBox() { box.classList.remove("open"); }
document.getElementById("lbclose").addEventListener("click", closeBox);
box.addEventListener("click", function (e) { if (e.target === box) closeBox(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeBox(); });

/* 사진이 안 열리면 안내 글자를 보여 준다 */
document.querySelectorAll(".thumb img").forEach(function (img) {
  img.addEventListener("error", function () {
    var p = img.parentNode;
    p.style.cursor = "default";
    p.innerHTML = '<span style="display:flex;height:100%;align-items:center;justify-content:center;padding:8px;text-align:center;color:#5a6577;font-size:0.85rem">사진을 불러오지 못했습니다. 사진 폴더 위치를 확인하세요.</span>';
  });
});

show((location.hash || "").replace("#", "") || "all");

/* 사진 점검용 표시 (열린 사진 수 / 전체 사진 수) */
window.addEventListener("load", function () {
  var imgs = document.querySelectorAll(".thumb img");
  var ok = 0;
  imgs.forEach(function (i) { if (i.complete && i.naturalWidth > 0) ok++; });
  document.documentElement.setAttribute("data-photos", ok + "/" + imgs.length);
});
</script>
